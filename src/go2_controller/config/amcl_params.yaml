# AMCL localization for the Go2 sim, against a pre-built map (e.g. maps/go2_explored.yaml).
# Used by launch/localization.launch.py instead of slam_toolbox: map_server serves the
# saved /map and amcl publishes map->odom by matching /scan to it. Sim uses SYSTEM time,
# so use_sim_time is false everywhere (matches nav2_params.yaml).
#
# The robot spawns at the map origin (0,0,0), so set_initial_pose seeds amcl there and no
# manual "2D Pose Estimate" is needed. Do NOT run slam_toolbox at the same time -- both
# would broadcast map->odom and fight over the TF.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""          # overridden by the launch 'map' argument
    topic_name: "map"
    frame_id: "map"

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    tf_broadcast: true                 # publish map->odom (replaces slam's)
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: true             # seed at spawn so no manual pose estimate needed
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

    # particle filter
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.10                  # m of travel before a filter update
    update_min_a: 0.20                  # rad of rotation before a filter update
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # laser model -- match the sim's 360-deg lidar (min range 0.1 m, walls < ~9 m away)
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.1
    laser_max_range: 12.0
    max_beams: 120
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    # differential-drive motion noise (sim odom is near-perfect, so keep small)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
